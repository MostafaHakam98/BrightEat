services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exposed ports - only accessible internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/start.sh
    volumes:
      - .:/app
    ports:
      - "19992:8000"
    environment:
      - DEBUG=True
      - DB_NAME=orderq
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-g@l$$t7h!hv)__!=&u5_b%)9hkbmmh7qc=d-!_$$bda5*bixmkky
      - FRONTEND_URL=https://localhost:19991
      - USE_HTTPS=True
      - CSRF_TRUSTED_ORIGINS=https://localhost:19991,https://127.0.0.1:19991
      - CORS_ALLOWED_ORIGINS=https://localhost:19991,https://127.0.0.1:19991
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    # No exposed ports - accessed through nginx-router
    depends_on:
      - backend

  flutter-pwa:
    build:
      context: ./mobile
      dockerfile: Dockerfile.pwa
    # No exposed ports - accessed through nginx-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx-router:
    image: nginx:alpine
    ports:
      - "80:80"
      - "19991:19991"
    volumes:
      - ./nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - flutter-pwa
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

