<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderQ — Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #f9fafb; color: #111827;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
    }
    .card { text-align: center; padding: 2rem; max-width: 22rem; }
    .emoji { font-size: 3rem; }
    h1 { font-size: 1.25rem; margin: 0.75rem 0 0.25rem; }
    p { color: #6b7280; margin: 0 0 1.25rem; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 0.75rem;
      padding: 0.6rem 1.4rem; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>You're offline</h1>
    <p>OrderQ needs a connection for live orders. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
