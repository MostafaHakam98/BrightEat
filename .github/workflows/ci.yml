name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check
        env:
          DB_HOST: 127.0.0.1

      - name: Missing-migrations guard
        run: python manage.py makemigrations --check --dry-run
        env:
          DB_HOST: 127.0.0.1

      - name: Run tests
        run: python manage.py test orders -v 2
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderq_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client
          pip install -r requirements.txt

      - name: Install frontend dependencies + browser
        working-directory: frontend
        run: |
          npm ci
          # Playwright's --with-deps runs `apt-get update`, which fails whenever
          # a preinstalled third-party repo on the hosted runner serves a bad
          # signature (packages.microsoft.com intermittently returns NOSPLIT).
          # Drop those repos first so browser-dependency install isn't blocked
          # by an unrelated mirror outage — Chromium's libs come from the Ubuntu
          # archives, which are unaffected.
          sudo grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f || true
          npx playwright install --with-deps chromium

      - name: Run golden-path E2E
        run: PYTHON=python ./scripts/run-e2e.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
