# Production docker-compose file using pre-built images
# Usage: docker-compose -f docker-compose.prod.yml up -d

name: orderq

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: orderq-backend:latest
    command: /app/start.sh
    volumes:
      - .:/app
    ports:
      - "19992:8000"
    environment:
      - DEBUG=False
      - DB_NAME=orderq
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-g@l$$t7h!hv)__!=&u5_b%)9hkbmmh7qc=d-!_$$bda5*bixmkky
      - ALLOWED_HOSTS=51.20.151.57,orderq.acai.brightskiesinc.com,localhost,backend
      - FRONTEND_URL=https://orderq.acai.brightskiesinc.com
      - USE_HTTPS=True
      - CSRF_TRUSTED_ORIGINS=https://51.20.151.57:19991,https://orderq.acai.brightskiesinc.com
      - CORS_ALLOWED_ORIGINS=https://51.20.151.57:19991,https://orderq.acai.brightskiesinc.com
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - HIVE_URL=https://acai.brightskiesinc.com
    networks:
      - default
      - hive-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started

  celery-worker:
    image: orderq-backend:latest
    command: celery -A OrderQ worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DB_NAME=orderq
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-g@l$$t7h!hv)__!=&u5_b%)9hkbmmh7qc=d-!_$$bda5*bixmkky
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - HIVE_URL=https://acai.brightskiesinc.com
    networks:
      - default
      - hive-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: orderq-backend:latest
    command: celery -A OrderQ beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DB_NAME=orderq
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-g@l$$t7h!hv)__!=&u5_b%)9hkbmmh7qc=d-!_$$bda5*bixmkky
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - default
      - hive-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  frontend:
    image: orderq-frontend:latest
    depends_on:
      - backend

  flutter-pwa:
    image: orderq-flutter-pwa:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx-router:
    image: nginx:alpine
    ports:
      - "19991:19991"
    volumes:
      - ./nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - flutter-pwa
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default: {}
  hive-network:
    external: true
    name: bsacaiportal_acai-network

